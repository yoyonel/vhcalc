[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vhcalc"
version = "0.8.0"
description = "It's a client-side library that implements a custom algorithm for extracting video hashes (fingerprints) from any video source."
readme = "docs/README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Lionel Atty", email = "yoyonel@hotmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.7",
    "click-pathlib>=2020.3.13",
    "rich>=13.8.0",
    "rich-click>=1.8.3",
    "typeguard>=4.3.0",
    "loguru>=0.7.2",
    "colorama>=0.4.6",
    "numpy>=2.0.2",
    "Distance>=0.1.3",
    "bitstring>=4.2.3",
    "ImageHash>=4.3.1",
    "Pillow>=9.1.1",
    "imageio-ffmpeg>=0.5.1",
    "pymediainfo>=6.1.0",
    "types-setuptools>=74.0.0.20240830",
]

[project.scripts]
export_imghash_from_media = "vhcalc.app:export_imghash_from_media"
vhcalc = "vhcalc.app:cli"
vhcalc-mediainfo = "vhcalc.app:mediainfo"

[dependency-groups]
dev = [
    "invoke>=2.2.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
    "hypothesis>=6.111.2",
    "coverage[toml]>=7.6.1",
    "mypy>=1.11.2",
    "bandit>=1.7.9",
    "safety>=2.3.5",
    "commitizen>=2.4.0",
    "pre-commit>=2.2.0",
    "mkdocs>=1.1",
    "mkdocs-material>=9.1.13",
    "pytest-click>=1.1.0",
    "mkdocs-git-revision-date-localized-plugin>=1.0.1",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-video>=1.3.0",
    "tox>=4.8.0",
    "pytest-localftpserver>=1.3.2",
    "flatten-dict>=0.4.2",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vhcalc"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv",
  "/.git",
  "/.cache",
  "/tests",
  "/docs",
  "/tasks"
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.0"
tag_format = "$version"
version_files = [
    "pyproject.toml:version"
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["vhcalc/tools/forked"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
exclude = '''(?x)(
    ^vhcalc/tools/forked               # all files named in "vhcalc/tools/forked/" directory
    | ^vhcalc/tools/version_extended_informations\.py$  # ignore[attr-defined] raise only in 3.9
    | ^tasks/                          # ignore tasks directory
)'''
files = [
    "vhcalc",
    "tests"
]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
    module = ["vhcalc.*"]
    # Ensure full coverage
    disallow_untyped_calls = true
    disallow_untyped_defs = true
    disallow_incomplete_defs = true
    disallow_untyped_decorators = true
    # Restrict dynamic typing
    disallow_any_generics = true
    disallow_subclassing_any = true
    warn_return_any = true

[[tool.mypy.overrides]]
    module = ["tests.*"]
    disallow_untyped_defs = false
    disallow_untyped_decorators = false


[tool.pytest.ini_options]
minversion = "6.0"
testpaths = "tests vhcalc"
addopts = "--strict-markers --doctest-modules"
norecursedirs = [
    ".*",
    "build",
    "dist",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "venv",
    "env",
    "virtualenv"
]

[tool.coverage]
    [tool.coverage.report]
    show_missing = true
    exclude_lines = [
        # Have to re-enable the standard pragma
        'pragma: no cover',

        # Don't complain about missing debug-only code:
        'def __repr__',
        'if self\.debug',

        # Don't complain if tests don't hit defensive assertion code:
        'raise AssertionError',
        'raise NotImplementedError',

        # Don't complain if non-runnable code isn't run:
        'if 0:',
        'if __name__ == .__main__.:'
    ]
    omit = [
        'env/*',
        'venv/*',
        '*/virtualenv/*',
        '*/virtualenvs/*',
        '*/tests/*',
        '*/tools/forked/*'
    ]
    [tool.coverage.run]
    relative_files = true
