name: C/C++ CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Just
      run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg cppcheck clang-tidy

    - name: Build
      working-directory: c_impl
      run: just build

    - name: Run Tests
      working-directory: c_impl
      run: just test

    - name: Run ASan Tests
      working-directory: c_impl
      run: just asan

    - name: Static Analysis
      working-directory: c_impl
      run: just check

    - name: Integration Test
      working-directory: c_impl
      run: |
        # Verify help output matches expected regex
        ./build/vhcalc -h | grep -E "Usage: .*vhcalc"

        # Verify hash generation on test video matches Python legacy output
        EXPECTED_LAST="d5d52ad528d528d5"
        ACTUAL_LAST=$(cat ../tests/data/big_buck_bunny_trailer_480p.mkv | ./build/vhcalc | ./build/vhcalc --decompress | fold -w 16 | tail -n 1)

        if [ "$ACTUAL_LAST" != "$EXPECTED_LAST" ]; then
          echo "Integration Test Failed: Expected last hash '$EXPECTED_LAST', got '$ACTUAL_LAST'"
          exit 1
        else
          echo "Integration Test Passed: Hash matches legacy output."
        fi
