---
name: New pull request received

on:
    pull_request:
    workflow_dispatch:
    push:
        branches:
            - main
            - master

jobs:
    check:
        runs-on: ${{ matrix.platform }}
        strategy:
            max-parallel: 12
            matrix:
                platform: [ubuntu-latest, windows-latest, macos-latest]
                python-version: [3.9, '3.10', '3.11', '3.12']
        env:
            FTP_FIXTURE_SCOPE: session
        steps:
            - name: Check out
              uses: actions/checkout@main
              with:
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v3
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@main
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  uv sync --all-extras

            - name: Style check
              run: |
                  uv run inv style

            - name: Check vulnerability
              run: |
                  uv run inv secure

            - name: Run tests with coverage
              run: |
                  uv run python -c 'from imageio_ffmpeg import get_ffmpeg_exe; print(get_ffmpeg_exe());'
                  uv run python -c 'from imageio_ffmpeg import get_ffmpeg_version; print(get_ffmpeg_version());'
                  uv run inv test.cov
                  uv run coverage lcov -o ./coverage/lcov.info

            - name: Coveralls
              # Error: Container action is only supported on Linux
              # https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idstepsif
              if: ${{ matrix.platform == 'ubuntu-latest' }}
              uses: coverallsapp/github-action@master
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  parallel: true

    coveralls_finish:
        needs: check
        runs-on: ubuntu-latest
        steps:
            - name: Coveralls Finished
              uses: AndreMiras/coveralls-python-action@develop
              with:
                  parallel-finished: true
